openapi: 3.2.0
info:
  description: This is the public REST API to integrate with the demisto server.
  title: Demisto Inv Playbook API
  version: 2.0.0
servers:
- url: https://hostname:443
security:
- api_key: []
- csrf_token: []
- x-xdr-auth-id: []
tags:
- name: Inv Playbook
paths:
  /inv-playbook/task/add/{investigationId}:
    post:
      description: Add an ad-hoc task to a running playbook
      summary: Add ad-hoc task
      operationId: addAdHocTask
      parameters:
      - description: investigation ID
        name: investigationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: InvestigationPlaybook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPlaybook'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvPlaybookTaskData'
          application/xml:
            schema:
              $ref: '#/components/schemas/InvPlaybookTaskData'
      tags:
      - Inv Playbook
  /inv-playbook/task/assign:
    post:
      description: Assign a task to an owner
      summary: Assign task
      operationId: taskAssign
      responses:
        '200':
          description: InvestigationPlaybook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPlaybook'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invPlaybookAssignee'
          application/xml:
            schema:
              $ref: '#/components/schemas/invPlaybookAssignee'
      tags:
      - Inv Playbook
  /inv-playbook/task/complete:
    post:
      description: 'Complete a task with a file attachment

        Deprecated - use "/v2/inv-playbook/task/complete"'
      summary: '[Deprecated] Complete a task'
      operationId: completeTask
      responses:
        '200':
          description: InvestigationPlaybook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPlaybook'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                investigationId:
                  type: string
                  description: investigation ID
                fileName:
                  type: string
                  description: file name
                fileComment:
                  type: string
                  description: file comment
                taskId:
                  type: string
                  description: Task Id
                taskInput:
                  type: string
                  description: task input
                version:
                  type: string
                  description: Version
                file:
                  type: string
                  description: file
                  format: binary
              required:
              - investigationId
              - fileComment
              - taskId
              - taskInput
              - version
              - file
      tags:
      - Inv Playbook
  /inv-playbook/task/complete/simple:
    post:
      description: Complete a task without a file attachment
      summary: Complete task simple (no file)
      operationId: simpleCompleteTask
      responses:
        '200':
          description: InvestigationPlaybook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPlaybook'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invTaskInfo'
          application/xml:
            schema:
              $ref: '#/components/schemas/invTaskInfo'
      tags:
      - Inv Playbook
  /inv-playbook/task/delete/{investigationId}/{invPBTaskId}:
    post:
      description: Delete an ad-hoc task from a running playbook
      summary: Delete ad-hoc task
      operationId: deleteAdHocTask
      parameters:
      - description: investigation ID
        name: investigationId
        in: path
        required: true
        schema:
          type: string
      - description: ad-hoc task ID
        name: invPBTaskId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: InvestigationPlaybook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPlaybook'
      tags:
      - Inv Playbook
  /inv-playbook/task/due:
    post:
      description: Set the task due date
      summary: Set task due date
      operationId: taskSetDue
      responses:
        '200':
          description: InvestigationPlaybook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPlaybook'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invPlaybookDue'
          application/xml:
            schema:
              $ref: '#/components/schemas/invPlaybookDue'
      tags:
      - Inv Playbook
  /inv-playbook/task/edit/{investigationId}:
    post:
      description: Edit an ad-hoc task in a running playbook
      summary: Edit ad-hoc task
      operationId: editAdHocTask
      parameters:
      - description: investigation ID
        name: investigationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: InvestigationPlaybook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPlaybook'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvPlaybookTaskData'
          application/xml:
            schema:
              $ref: '#/components/schemas/InvPlaybookTaskData'
      tags:
      - Inv Playbook
  /inv-playbook/task/note/add:
    post:
      description: Add comment to a task
      summary: Task add comment
      operationId: taskAddComment
      responses:
        '200':
          description: InvestigationPlaybook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPlaybook'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invTaskInfo'
          application/xml:
            schema:
              $ref: '#/components/schemas/invTaskInfo'
      tags:
      - Inv Playbook
  /inv-playbook/task/uncomplete:
    post:
      description: Reopen a closed task and change the status to uncomplete
      summary: Un complete a task
      operationId: taskUnComplete
      responses:
        '200':
          description: InvestigationPlaybook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPlaybook'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invTaskInfo'
          application/xml:
            schema:
              $ref: '#/components/schemas/invTaskInfo'
      tags:
      - Inv Playbook
  /v2/inv-playbook/task/complete:
    post:
      description: Complete a task with command and multiple file attachments
      summary: Complete a task
      operationId: completeTaskV2
      responses:
        '200':
          description: InvestigationPlaybook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPlaybook'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                investigationId:
                  type: string
                  description: investigation ID
                taskId:
                  type: string
                  description: Task Id
                taskComment:
                  type: string
                  description: Task comment or command to run
                taskInput:
                  type: string
                  description: Task input
                version:
                  type: string
                  description: Version
                file:
                  type: string
                  description: Files to attach to the task
                  format: binary
                fileNames:
                  type: string
                  description: file names separated by %###% (only if files provided)
                fileComments:
                  type: string
                  description: file comment separated by %###% (only if files provided)
              required:
              - investigationId
              - taskId
              - taskInput
              - version
              - file
      tags:
      - Inv Playbook
  /v2/inv-playbook/task/form/submit:
    post:
      description: Submit a data collection task with given answers and multiple file attachments
      summary: Complete a task
      operationId: submitTaskForm
      responses:
        '200':
          description: InvestigationPlaybook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPlaybook'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                investigationId:
                  type: string
                  description: investigation ID
                taskId:
                  type: string
                  description: Task Id
                answers:
                  type: string
                  description: the answers to the task form. Answers are keyed by numerical question id
                file:
                  type: string
                  description: Files to attach to the task
                  format: binary
              required:
              - investigationId
              - taskId
              - answers
      tags:
      - Inv Playbook
components:
  schemas:
    FieldMapping:
      description: FieldMapping - Map a task output (complex or simple value) to an incident field
      type: object
      properties:
        fieldId:
          type: string
          x-go-name: IncidentField
        output:
          $ref: '#/components/schemas/AdvanceArg'
      x-go-package: github.com/demisto/server/domain
    PlaybookOutput:
      description: PlaybookOutput represents the playbook output
      type: object
      properties:
        contextPath:
          type: string
          x-go-name: ContextPath
        description:
          type: string
          x-go-name: Description
        type:
          $ref: '#/components/schemas/OutputType'
      x-go-package: github.com/demisto/server/domain
    TaskLoop:
      description: TaskLoop contains loop details
      type: object
      properties:
        brand:
          type: string
          x-go-name: Brand
        builtinCondition:
          type: array
          items:
            $ref: '#/components/schemas/ArgFilter'
          x-go-name: BuiltInCondition
        exitCondition:
          type: string
          x-go-name: ExitCondition
        forEach:
          type: boolean
          x-go-name: ForEach
        isCommand:
          type: boolean
          x-go-name: IsCommand
        scriptArguments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AdvanceArg'
          x-go-name: ScriptArguments
        scriptId:
          type: string
          x-go-name: AutomationScriptID
        wait:
          type: integer
          format: int64
          x-go-name: WaitBetweenIterations
      x-go-package: github.com/demisto/server/domain
    InvPlaybookTaskData:
      type: object
      title: InvPlaybookTaskData ...
      properties:
        addAfter:
          type: boolean
          x-go-name: AddAfter
        automationScript:
          type: string
          x-go-name: AutomationScript
        description:
          type: string
          x-go-name: Description
        name:
          type: string
          x-go-name: Name
        neighborInvPBTaskId:
          type: string
          x-go-name: NeighborInvPBTaskID
        scriptArguments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AdvanceArg'
          x-go-name: ScriptArguments
        tags:
          type: array
          items:
            type: string
          x-go-name: Tags
      x-go-package: github.com/demisto/server/services
    TaskState:
      description: TaskState indicates the state of the task during the incident/investigation execution
      type: string
      x-go-package: github.com/demisto/server/domain
    ArgFilter:
      description: ArgFilter - represent a slice of atomic filters with OR condition between them (e.i. - atomic1 OR atomic2 OR ...)
      type: array
      items:
        $ref: '#/components/schemas/ArgAtomicFilter'
      x-go-package: github.com/demisto/server/domain
    ArgTransformer:
      type: object
      title: ArgTransformer ...
      properties:
        args:
          x-go-name: Args
        operator:
          $ref: '#/components/schemas/TransformerOperatorID'
      x-go-package: github.com/demisto/server/domain
    ArgAtomicFilter:
      description: ArgAtomicFilter - operator with two sides that return true/false
      type: object
      properties:
        ignoreCase:
          type: boolean
          x-go-name: IgnoreCase
        left:
          $ref: '#/components/schemas/OperatorArgument'
        operator:
          $ref: '#/components/schemas/FilterOperatorID'
        right:
          $ref: '#/components/schemas/OperatorArgument'
        type:
          type: string
          x-go-name: Type
      x-go-package: github.com/demisto/server/domain
    EvidenceData:
      description: EvidenceData - all evidence properties to evaluate in task process
      type: object
      properties:
        customFields:
          description: This field must have empty json key
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AdvanceArg'
          x-go-name: CustomFields
        description:
          $ref: '#/components/schemas/AdvanceArg'
        occurred:
          $ref: '#/components/schemas/AdvanceArg'
        tags:
          $ref: '#/components/schemas/AdvanceArg'
      x-go-package: github.com/demisto/server/domain
    PlaybookInput:
      description: PlaybookInput represents the playbook input
      type: object
      properties:
        description:
          type: string
          x-go-name: Description
        key:
          type: string
          x-go-name: Key
        required:
          type: boolean
          x-go-name: Required
        value:
          $ref: '#/components/schemas/AdvanceArg'
      x-go-package: github.com/demisto/server/domain
    FilterOperatorID:
      type: string
      title: FilterOperatorID ...
      x-go-package: github.com/demisto/server/domain
    InvestigationPlaybookState:
      description: InvestigationPlaybookState indicates the state of the running playbook
      type: string
      x-go-package: github.com/demisto/server/domain
    PlaybookOutputs:
      description: PlaybookOutputs - array of PlaybookOutput
      type: array
      items:
        $ref: '#/components/schemas/PlaybookOutput'
      x-go-package: github.com/demisto/server/domain
    QuietMode:
      description: QuietMode quiet mode for playbook task
      type: integer
      format: int64
      x-go-package: github.com/demisto/server/domain
    AdvanceArg:
      description: 'Simple: plain text such as "hello" (constant) or ${File.ID} (DT expression)

        Complex: struct with all info that is necessary to compute argument value from context (Root, Filters, Accessor & Transformers)'
      type: object
      title: 'AdvanceArg - advance argument can be one of the following:'
      properties:
        complex:
          $ref: '#/components/schemas/ComplexArg'
        simple:
          type: string
          x-go-name: Simple
      x-go-package: github.com/demisto/server/domain
    SLA:
      type: object
      title: SLA ...
      properties:
        days:
          type: integer
          format: int64
          x-go-name: Days
        hours:
          type: integer
          format: int64
          x-go-name: Hours
        weeks:
          type: integer
          format: int64
          x-go-name: Weeks
      x-go-package: github.com/demisto/server/domain
    InvestigationPlaybook:
      description: InvestigationPlaybook is a wrapper for a linked list of Playbook tasks
      type: object
      properties:
        Dirty:
          type: boolean
        ReadyPlaybookInputs:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        ReplacedPlaybook:
          description: Indicate whether this playbook has new history during this session
          type: boolean
        ShardID:
          type: integer
          format: int64
        UpdatedOperatorIDs:
          type: boolean
        autoExtracting:
          type: boolean
          x-go-name: AutoExtracting
        comment:
          type: string
          x-go-name: Description
        hasRole:
          description: Internal field to make queries on role faster
          type: boolean
          x-go-name: HasRole
        id:
          type: string
          x-go-name: ID
        incidentCreateDate:
          description: Incident create date
          type: string
          format: date-time
          x-go-name: IncidentCreateDate
        inputs:
          $ref: '#/components/schemas/PlaybookInputs'
        investigationId:
          type: string
          x-go-name: InvestigationID
        modified:
          type: string
          format: date-time
          x-go-name: Modified
        name:
          type: string
          x-go-name: Name
        outputs:
          $ref: '#/components/schemas/PlaybookOutputs'
        pbHistory:
          description: 'in: body'
          type: array
          items:
            $ref: '#/components/schemas/InvestigationPlaybookData'
          x-go-name: PbHistory
        playbookId:
          type: string
          x-go-name: PlaybookID
        previousRoles:
          description: PreviousRoleName - do not change this field manually
          type: array
          items:
            type: string
          x-go-name: PreviousRoleName
        roles:
          description: The role assigned to this investigation
          type: array
          items:
            type: string
          x-go-name: RoleName
        sortValues:
          type: array
          items:
            type: string
          x-go-name: SortValues
        startDate:
          type: string
          format: date-time
          x-go-name: StartDate
        startTaskId:
          description: FirstTask is the root task of the playbook
          type: string
          x-go-name: StartTaskID
        state:
          $ref: '#/components/schemas/InvestigationPlaybookState'
        subPlaybookInputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlaybookInputs'
          x-go-name: SubPlaybookInputs
        subPlaybookOutputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlaybookOutputs'
          x-go-name: SubPlaybookOutputs
        tasks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InvestigationPlaybookTask'
          x-go-name: Tasks
        version:
          type: integer
          format: int64
          x-go-name: Versn
        view:
          $ref: '#/components/schemas/PlaybookView'
      x-go-package: github.com/demisto/server/domain
    Question:
      type: object
      title: Question - question for a form with a given type.
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/GridColumn'
          x-go-name: GridColumns
        defaultRows:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
          x-go-name: DefaultRows
        fieldAssociated:
          type: string
          x-go-name: FieldAssociated
        id:
          type: string
          x-go-name: ID
        label:
          type: string
          x-go-name: Label
        labelArg:
          $ref: '#/components/schemas/AdvanceArg'
        options:
          type: array
          items:
            type: string
          x-go-name: Options
        placeholder:
          type: string
          x-go-name: Placeholder
        required:
          type: boolean
          x-go-name: Required
        tooltip:
          type: string
          x-go-name: Tooltip
        type:
          type: string
          x-go-name: Type
      x-go-package: github.com/demisto/server/domain
    DataCollectionForm:
      type: object
      title: DataCollectionForm - a data collection form with questions.
      properties:
        description:
          type: string
          x-go-name: Description
        expired:
          type: boolean
          x-go-name: Expired
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
          x-go-name: Questions
        sender:
          type: string
          x-go-name: Sender
        title:
          type: string
          x-go-name: Title
        totalAnswers:
          type: integer
          format: uint64
          x-go-name: TotalAnswers
      x-go-package: github.com/demisto/server/domain
    OperatorArgument:
      type: object
      title: OperatorArgument ...
      properties:
        isContext:
          type: boolean
          x-go-name: IsContext
        value:
          $ref: '#/components/schemas/AdvanceArg'
      x-go-package: github.com/demisto/server/domain
    TaskType:
      description: TaskType is the Task in the playbook context as a node
      type: string
      x-go-package: github.com/demisto/server/domain
    TaskCondition:
      description: 'TaskCondition - contains a condition and a corresponding label

        if the condition satisfied - its label is taken as the next task(s) input (e.i. the label on the edge)'
      type: object
      properties:
        condition:
          type: array
          items:
            $ref: '#/components/schemas/ArgFilter'
          x-go-name: Condition
        label:
          type: string
          x-go-name: Label
      x-go-package: github.com/demisto/server/domain
    PlaybookInputs:
      description: PlaybookInputs - array of PlaybookInput
      type: array
      items:
        $ref: '#/components/schemas/PlaybookInput'
      x-go-package: github.com/demisto/server/domain
    NotifiableItem:
      type: object
      title: NotifiableItem ...
      properties:
        bcc:
          $ref: '#/components/schemas/AdvanceArg'
        body:
          $ref: '#/components/schemas/AdvanceArg'
        cc:
          $ref: '#/components/schemas/AdvanceArg'
        defaultOption:
          type: string
          x-go-name: DefaultOption
        format:
          type: string
          x-go-name: Format
        methods:
          type: array
          items:
            type: string
          x-go-name: Methods
        replyOptions:
          type: array
          items:
            type: string
          x-go-name: ReplyOptions
        subject:
          $ref: '#/components/schemas/AdvanceArg'
        timings:
          $ref: '#/components/schemas/NotifyTimings'
        to:
          $ref: '#/components/schemas/AdvanceArg'
      x-go-package: github.com/demisto/server/domain
    TransformerOperatorID:
      type: string
      title: TransformerOperatorID ...
      x-go-package: github.com/demisto/server/domain
    TaskView:
      description: TaskView represents the view in client of the tasks graph
      type: object
      x-go-package: github.com/demisto/server/domain
    InvestigationPlaybookData:
      description: InvestigationPlaybookData returns all data of an investigation playbook, not including history
      type: object
      properties:
        ReadyPlaybookInputs:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        autoExtracting:
          type: boolean
          x-go-name: AutoExtracting
        comment:
          type: string
          x-go-name: Description
        inputs:
          $ref: '#/components/schemas/PlaybookInputs'
        investigationId:
          type: string
          x-go-name: InvestigationID
        name:
          type: string
          x-go-name: Name
        outputs:
          $ref: '#/components/schemas/PlaybookOutputs'
        playbookId:
          type: string
          x-go-name: PlaybookID
        startDate:
          type: string
          format: date-time
          x-go-name: StartDate
        startTaskId:
          description: FirstTask is the root task of the playbook
          type: string
          x-go-name: StartTaskID
        state:
          $ref: '#/components/schemas/InvestigationPlaybookState'
        subPlaybookInputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlaybookInputs'
          x-go-name: SubPlaybookInputs
        subPlaybookOutputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlaybookOutputs'
          x-go-name: SubPlaybookOutputs
        tasks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InvestigationPlaybookTask'
          x-go-name: Tasks
        view:
          $ref: '#/components/schemas/PlaybookView'
      x-go-package: github.com/demisto/server/domain
    OutputType:
      type: string
      title: OutputType ...
      x-go-package: github.com/demisto/server/domain
    PlaybookView:
      description: PlaybookView represents the view in client of playbook graph
      type: object
      x-go-package: github.com/demisto/server/domain
    Task:
      description: Task is the basic task in the task repository that can be associated to an incident via playbook
      type: object
      properties:
        brand:
          type: string
          x-go-name: Brand
        clonedFrom:
          type: string
          x-go-name: ClonedFrom
        comment:
          type: string
          x-go-name: Comment
        conditions:
          type: array
          items:
            type: string
          x-go-name: ConditionnKeys
        description:
          type: string
          x-go-name: Description
        id:
          type: string
          x-go-name: ID
        isCommand:
          type: boolean
          x-go-name: IsCommand
        isLocked:
          type: boolean
          x-go-name: IsLocked
        isSystemTask:
          type: boolean
          x-go-name: IsSystemTask
        isTitleTask:
          type: boolean
          x-go-name: IsTitleTask
        modified:
          type: string
          format: date-time
          x-go-name: Modified
        name:
          type: string
          x-go-name: Name
        playbookId:
          type: string
          x-go-name: PlaybookID
        scriptId:
          type: string
          x-go-name: AutomationScriptID
        sortValues:
          type: array
          items:
            type: string
          x-go-name: SortValues
        tags:
          type: array
          items:
            type: string
          x-go-name: Tags
        type:
          $ref: '#/components/schemas/TaskType'
        version:
          type: integer
          format: int64
          x-go-name: Versn
      x-go-package: github.com/demisto/server/domain
    GridColumn:
      type: object
      title: GridColumn ...
      properties:
        displayName:
          type: string
          x-go-name: DisplayName
        fieldCalcScript:
          type: string
          x-go-name: FieldCalcScript
        isDefault:
          type: boolean
          x-go-name: IsDefault
        isReadOnly:
          type: boolean
          x-go-name: IsReadOnly
        key:
          type: string
