swagger: '2.0'
info:
  description: 'This is the public REST API to integrate with the demisto server.

    HTTP request can be sent using any HTTP-client.


    For an example dedicated client take a look at: https://github.com/demisto/demisto-py.


    Requests must include API-key that can be generated in the Demisto web client under ''Settings'' -> ''Integrations'' -> ''API keys''



    Optimistic Locking and Versioning\:


    When using Demisto REST API, you will need to make sure to work on the latest version of the item (incident, entry, etc.), otherwise, you will get a DB version error (which not allow you to override a newer item).

    In addition, you can pass ''version\: -1'' to force data override (make sure that other users data might be lost).


    Assume that Alice and Bob both read the same data from Demisto server, then they both changed the data, and then both tried to write the new versions back to the server. Whose changes should be saved? Alice’s? Bob’s?

    To solve this, each data item in Demisto has a numeric incremental version.

    If Alice saved an item with version 4 and Bob trying to save the same item with version 3, Demisto will rollback Bob request and returns a DB version conflict error.

    Bob will need to get the latest item and work on it so Alice work will not get lost.


    Example request using ''curl''\:


    ```

    curl ''https://hostname:443/incidents/search'' -H ''content-type: application/json'' -H ''accept: application/json'' -H ''Authorization: <API Key goes here>'' --data-binary ''{"filter":{"query":"-status:closed -category:job","period":{"by":"day","fromValue":7}}}'' --compressed

    ```'
  title: Demisto Apikeys Indicators API
  version: 2.0.0
host: hostname:443
schemes:
- https
consumes:
- application/json
- application/xml
produces:
- application/json
security:
- api_key: []
- csrf_token: []
- x-xdr-auth-id: []
tags:
- name: Indicators
paths:
  /indicators/batch/export/stix:
    post:
      description: Exports an indicators batch to STIX file (returns file ID)
      summary: Batch export indicators to STIX
      operationId: exportIndicatorsToStixBatch
      parameters:
      - name: genericIndicatorUpdateBatch
        in: body
        schema:
          $ref: '#/definitions/genericIndicatorUpdateBatch'
      responses:
        '200':
          description: STIX file name
          schema:
            type: string
      tags:
      - Indicators
  /indicators/batch/exportToCsv:
    post:
      description: Exports an indicators batch to CSV file (returns file ID)
      summary: Batch export indicators to csv
      operationId: exportIndicatorsToCsvBatch
      parameters:
      - description: 'Required parameters from `genericIndicatorUpdateBatch`: `columns`,

          `filter`. You should also include either `all` or `ids`

          '
        name: genericIndicatorUpdateBatch
        in: body
        schema:
          $ref: '#/definitions/genericIndicatorUpdateBatch'
      responses:
        '200':
          description: csv file name
          schema:
            type: string
      tags:
      - Indicators
  /indicators/batchDelete:
    post:
      description: 'Batch whitelist or delete indicators entities

        In order to delete indicators and not whitelist, set doNotWhitelist boolean field to true'
      summary: Batch whitelist or delete indicators
      operationId: deleteIndicatorsBatch
      parameters:
      - name: genericIndicatorUpdateBatch
        in: body
        schema:
          $ref: '#/definitions/genericIndicatorUpdateBatch'
      responses:
        '200':
          description: UpdateResponse
          schema:
            $ref: '#/definitions/UpdateResponse'
      tags:
      - Indicators
  /indicators/csv/{id}:
    get:
      description: Get an indicators CSV file that was exported, by ID
      produces:
      - application/octet-stream
      summary: Get indicators as CSV
      operationId: getIndicatorsAsCsv
      parameters:
      - type: string
        description: CSV file to fetch (returned from batch export to csv call)
        name: id
        in: path
        required: true
      responses:
        '200':
          description: Return Csv file
          schema:
            type: file
      tags:
      - Indicators
  /indicators/feed/json:
    post:
      description: 'Create indicators from raw JSON (similar to ingesting from a feed). Builds indicators according to the specified feed classifier,

        or uses the default one if not specified.

        Indicator properties (all optional except for value): **value** (string, required) | **type** (string) | **score** (number, 0-3,

        default `0`, where `0` means None, `1` Good, `2` Suspicious, and `3` Bad) | **sourceBrand** (string, default `"External"`) | **sourceInstance**

        (string, default `"External"`) | **reliability** (string, one of `"A - Completely reliable"`, `"B - Usually reliable"`, `"C - Fairly

        reliable"`, `"D - Not usually reliable"`, `"E - Unreliable"`, `"F - Reliability cannot be judged"`) | **expirationPolicy** (string,

        one of `"never"`, `"interval"`, `"indicatorType"`) | **expirationInterval** (number, in minutes)'
      summary: Create feed indicators from JSON
      operationId: createFeedIndicatorsJson
      parameters:
      - name: FeedIndicatorsRequest
        in: body
        required: true
        schema:
          $ref: '#/definitions/FeedIndicatorsRequest'
      responses:
        '201':
          description: Indicators created
      tags:
      - Indicators
  /indicators/search:
    post:
      description: Search indicators by filter
      summary: Search indicators
      operationId: indicatorsSearch
      parameters:
      - name: IndicatorFilter
        in: body
        schema:
          $ref: '#/definitions/IndicatorFilter'
      responses:
        '200':
          description: indicatorResult
          schema:
            $ref: '#/definitions/IndicatorResult'
      tags:
      - Indicators
  /indicators/stix/v2/{id}:
    get:
      description: Get an indicators STIX V2 file that was exported, by ID
      produces:
      - application/octet-stream
      summary: Get indicators as STIX V2
      operationId: getIndicatorsAsSTIX
      parameters:
      - type: string
        description: STIX V2 file to fetch (returned from batch export to STIX call)
        name: id
        in: path
        required: true
      responses:
        '200':
          description: Return STIX V2 file
          schema:
            type: file
      tags:
      - Indicators
  /indicators/upload:
    post:
      description: Create indicators from a file
      consumes:
      - multipart/form-data
      summary: Create indicators
      operationId: indicatorsCreateBatch
      parameters:
      - type: string
        description: file name
        name: fileName
        in: formData
      - type: file
        description: file
        name: file
        in: formData
        required: true
      responses:
        '200':
          description: IocObjects
          schema:
            $ref: '#/definitions/IocObjects'
      tags:
      - Indicators
