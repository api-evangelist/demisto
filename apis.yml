aid: demisto
name: Demisto
description: >-
  Demisto is a Security Orchestration, Automation, and Response (SOAR) platform that unifies incident
  case management, playbook-driven automation, real-time analyst collaboration (the "War Room"), and
  threat-intelligence management. Founded as an independent security startup backed by Accel and Greylock,
  Demisto was acquired by Palo Alto Networks in 2019 for roughly $560M and rebranded as Cortex XSOAR;
  the demisto.com domain now redirects to the Cortex XSOAR product. The Demisto REST API exposes
  incidents, war-room entries, evidence, threat indicators, and automation scripts programmatically,
  with a Swagger 2.0 specification, an official Python client (demisto-py), and a content-development
  SDK/CLI (demisto-sdk). This API Evangelist profile was enriched from the provider's public developer
  surface (xsoar.pan.dev, docs-cortex.paloaltonetworks.com, and the github.com/demisto organization).
